[project]
name = "ogoogle-ai-backend"
version = "0.1.0"
description = "FastAPI and Google ADK streaming foundation for oGoogle AI"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.141,<1",
  "uvicorn[standard]==0.54.0",
  "google-adk==2.12.0",
  "google-genai>=1.52,<3",
  "pydantic>=2.12,<3",
  "pydantic-settings==2.15.0",
  "sse-starlette==3.5.0",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.21,<1",
  "firebase-admin==7.7.0",
  "google-cloud-firestore==2.34.1",
  "itsdangerous>=2.2,<3",
  "structlog>=25,<27",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "httpx>=0.28,<1",
  "ruff>=0.14,<1",
  "mypy>=1.18,<2",
  "pip-audit>=2.9,<3",
  "httpx2>=2.13.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
files = ["app"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
