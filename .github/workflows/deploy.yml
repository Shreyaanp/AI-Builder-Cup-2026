name: Cloud Run release
on:
  # Continuous delivery: every push to main whose checks passed is released.
  workflow_run:
    workflows: ['oGoogle AI checks']
    types: [completed]
    branches: [main]
  # Manual path (hotfix, redeploy, scripts/ship.ps1): same checked, candidate-first release.
  workflow_dispatch:
    inputs:
      revision:
        description: Commit SHA on main (blank uses current main)
        type: string
        required: false
      release_tag:
        description: Optional published release-* tag that must point to the selected main commit
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: ogoogle-production-release
  cancel-in-progress: false
jobs:
  revision:
    # Manual runs from main, or a main push whose checks passed (never a pull request's run).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      stale: ${{ steps.select.outputs.stale }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: select
        env:
          REQUESTED_SHA: ${{ inputs.revision || github.event.workflow_run.head_sha }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          revision="${REQUESTED_SHA:-$GITHUB_SHA}"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$revision" origin/main
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^release-[a-zA-Z0-9._-]+$ ]]
            test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$revision"
          fi
          # A push run is stale when main has moved on: the newer push has its own run.
          if [[ "$EVENT" == "workflow_run" && "$revision" != "$(git rev-parse origin/main)" ]]; then
            echo "::notice::$revision is no longer the tip of main; the newer commit releases itself."
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sha=$revision" >> "$GITHUB_OUTPUT"
  # Skip re-testing when the push checks already passed for this exact commit.
  gate:
    needs: revision
    if: needs.revision.outputs.stale != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      tested: ${{ steps.find.outputs.tested }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.revision.outputs.sha }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/checks.yml/runs?head_sha=$SHA&branch=main&event=push&status=success&per_page=1" --jq '.total_count')
          if [[ "$passed" -gt 0 ]]; then echo "tested=true" >> "$GITHUB_OUTPUT"; else echo "tested=false" >> "$GITHUB_OUTPUT"; fi
          echo "Successful checks runs for $SHA: $passed"
  checks:
    needs: [revision, gate]
    if: needs.gate.outputs.tested != 'true'
    uses: ./.github/workflows/checks.yml
    with:
      revision: ${{ needs.revision.outputs.sha }}
  release:
    needs: [revision, gate, checks]
    if: >-
      always() && needs.revision.result == 'success' && needs.revision.outputs.stale != 'true' &&
      needs.gate.result == 'success' &&
      (needs.gate.outputs.tested == 'true' || needs.checks.result == 'success')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_SHA: ${{ needs.revision.outputs.sha }}
      FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
      FIREBASE_WEB_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
      FEATURE_GOOGLE_GUIDE: ${{ vars.FEATURE_GOOGLE_GUIDE || 'true' }}
      GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID || '' }}
      LANDING_VARIANT: ${{ vars.LANDING_VARIANT || 'new' }}
      PUBLIC_DEMO_ENABLED: ${{ vars.PUBLIC_DEMO_ENABLED || 'true' }}
      MAPS_GROUNDING: ${{ vars.MAPS_GROUNDING || 'live' }}
      MAPS_GROUNDING_CACHE_SECONDS: ${{ vars.MAPS_GROUNDING_CACHE_SECONDS || '86400' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.revision.outputs.sha }}
      - name: Check production configuration
        env:
          GCP_IDENTITY_PROVIDER: ${{ vars.GCP_IDENTITY_PROVIDER }}
        run: |
          for name in FIREBASE_WEB_API_KEY FIREBASE_WEB_APP_ID GCP_IDENTITY_PROVIDER; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing production setting: $name"
              exit 1
            fi
          done
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build immutable image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: asia-south1-docker.pkg.dev/ichiropractic/ogoogle-ai/app:${{ needs.revision.outputs.sha }}
          build-args: ASSET_BASE_URL=${{ vars.CDN_HOSTING_SITE && format('https://{0}.web.app/', vars.CDN_HOSTING_SITE) || '/' }}
          cache-from: type=gha
      - id: google
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_IDENTITY_PROVIDER }}
          service_account: ogoogle-deployer@ichiropractic.iam.gserviceaccount.com
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@v3.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      # First check after sign-in, before anything is built or pushed: stop if the live service
      # holds an env var this release would not carry (names only are printed).
      - name: Check live environment drift
        run: |
          FACE_WORKER_URL=$(gcloud run services describe ogoogle-face --project=ichiropractic --region=asia-south1 --format='value(status.url)')
          export FACE_WORKER_URL
          test -n "$FACE_WORKER_URL"
          python deployment/runtime-config.py
          python scripts/check-env-drift.py
      - name: Publish exact image assets to Firebase CDN (opt-in)
        if: vars.CDN_HOSTING_SITE != ''
        env:
          CDN_HOSTING_SITE: ${{ vars.CDN_HOSTING_SITE }}
        run: |
          mkdir -p .deployment/cdn
          container=$(docker create "asia-south1-docker.pkg.dev/ichiropractic/ogoogle-ai/app:$RELEASE_SHA")
          docker cp "$container:/app/frontend/assets" .deployment/cdn/assets
          docker rm "$container"
          python -c 'import json,os; from pathlib import Path; config=json.loads(Path("deployment/firebase.assets.json").read_text()); config["hosting"].update(site=os.environ["CDN_HOSTING_SITE"], public="cdn"); Path(".deployment/firebase-cdn.json").write_text(json.dumps(config))'
          npx --yes --package=firebase-tools@14.22.0 firebase deploy --project ichiropractic \
            --config .deployment/firebase-cdn.json --only hosting --non-interactive
      - name: Publish immutable image
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: |
          echo "$GOOGLE_ACCESS_TOKEN" | docker login -u oauth2accesstoken --password-stdin https://asia-south1-docker.pkg.dev
          image="asia-south1-docker.pkg.dev/ichiropractic/ogoogle-ai/app:$RELEASE_SHA"
          docker push "$image"
      # The face worker only changes with its own inputs; skip ~2 minutes when it is current.
      - name: Check face worker inputs
        id: face
        run: |
          inputs=$(cat backend/face.Dockerfile backend/face_worker.py backend/scripts/fetch_face_models.py backend/pyproject.toml backend/uv.lock | sha256sum | cut -c1-16)
          echo "tag=inputs-$inputs" >> "$GITHUB_OUTPUT"
          current=$(gcloud run services describe ogoogle-face --project=ichiropractic --region=asia-south1 --format='value(spec.template.spec.containers[0].image)' 2>/dev/null || true)
          if [[ "$current" == *":inputs-$inputs" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "Face worker already runs inputs-$inputs; skipping its build and release."
            # A no-traffic test revision pins traffic; make sure the current image serves.
            gcloud run services update-traffic ogoogle-face --project=ichiropractic --region=asia-south1 --to-latest --quiet
            echo "FACE_WORKER_URL=$(gcloud run services describe ogoogle-face --project=ichiropractic --region=asia-south1 --format='value(status.url)')" >> "$GITHUB_ENV"
          fi
      - name: Build private face worker
        if: steps.face.outputs.current != 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: backend/face.Dockerfile
          push: true
          platforms: linux/amd64
          tags: asia-south1-docker.pkg.dev/ichiropractic/ogoogle-ai/face:${{ steps.face.outputs.tag }}
          cache-from: type=gha,scope=face
          cache-to: type=gha,scope=face,mode=max
      - name: Release private face worker
        if: steps.face.outputs.current != 'true'
        env:
          FACE_TAG: ${{ steps.face.outputs.tag }}
        run: |
          gcloud run deploy ogoogle-face --project=ichiropractic --region=asia-south1 \
            --image="asia-south1-docker.pkg.dev/ichiropractic/ogoogle-ai/face:$FACE_TAG" \
            --service-account=ogoogle-face-runtime@ichiropractic.iam.gserviceaccount.com \
            --set-secrets=FACE_WORKER_TOKEN=ogoogle-face-token:1 \
            --set-env-vars=FACE_REQUIRE_MODELS=true \
            --no-allow-unauthenticated --min=0 --max=1 --concurrency=1 \
            --cpu=1 --memory=2Gi --timeout=60 --cpu-boost --quiet
          # Without this, traffic pinned by a no-traffic test revision stays on the old worker.
          gcloud run services update-traffic ogoogle-face --project=ichiropractic --region=asia-south1 --to-latest --quiet
          url=$(gcloud run services describe ogoogle-face --project=ichiropractic --region=asia-south1 --format='value(status.url)')
          test -n "$url"
          echo "FACE_WORKER_URL=$url" >> "$GITHUB_ENV"
      # Safe rollout: the new revision gets no traffic and a "candidate" tag URL, is smoke-tested
      # there, and only then takes 100%. Any failure stops the run and traffic stays where it was.
      # --update-env-vars / --update-secrets merge into the live service, so a variable set by
      # hand is never dropped (the old release replaced the whole environment).
      - name: Note the revision serving traffic now
        run: |
          previous=$(gcloud run services describe ogoogle-ai --project=ichiropractic --region=asia-south1 --format='value(status.traffic[0].revisionName)')
          test -n "$previous"
          echo "PREVIOUS_REVISION=$previous" >> "$GITHUB_ENV"
          echo "Serving now: $previous"
      - name: Deploy candidate revision (no traffic)
        run: |
          python deployment/runtime-config.py
          secrets=$(python -c 'import json; print(",".join(f"{k}={v}" for k, v in json.load(open("deployment/secrets.json")).items()))')
          gcloud run deploy ogoogle-ai --project=ichiropractic --region=asia-south1             --image="asia-south1-docker.pkg.dev/ichiropractic/ogoogle-ai/app:$RELEASE_SHA"             --service-account=ogoogle-runtime@ichiropractic.iam.gserviceaccount.com             --update-env-vars="$(cat .deployment/update-env-vars.txt)"             --update-secrets="$secrets" --allow-unauthenticated             --min=1 --max=20 --concurrency=40 --timeout=3600 --cpu=1 --memory=2Gi             --no-cpu-throttling --session-affinity --cpu-boost             --no-traffic --tag=candidate --quiet
          gcloud run services describe ogoogle-ai --project=ichiropractic --region=asia-south1 --format=json > .deployment/service.json
          node -e '
            const s = JSON.parse(require("fs").readFileSync(".deployment/service.json", "utf8"));
            const t = s.status.traffic.find((x) => x.tag === "candidate");
            if (!t) throw new Error("no candidate tag URL on the service");
            console.log("CANDIDATE_URL=" + t.url);
            console.log("CANDIDATE_REVISION=" + t.revisionName);
          ' >> "$GITHUB_ENV"
      - name: Install browser for the smoke check
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Smoke-test the candidate revision
        env:
          SMOKE_ORIGIN: ${{ env.CANDIDATE_URL }}
          SMOKE_COACH_MODE: gemini
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
        run: |
          node scripts/hosting-smoke.mjs
          node scripts/prod-smoke.mjs "$CANDIDATE_URL"
      - name: Send all traffic to the candidate
        id: cutover
        run: |
          gcloud run services update-traffic ogoogle-ai --project=ichiropractic --region=asia-south1             --to-revisions="$CANDIDATE_REVISION=100" --quiet
          # Back to "always the latest revision" (a pinned revision makes the next deploy
          # silently stay dark, OB-93), but only when the candidate is still the newest.
          latest=$(gcloud run services describe ogoogle-ai --project=ichiropractic --region=asia-south1 --format='value(status.latestCreatedRevisionName)')
          test "$latest" = "$CANDIDATE_REVISION"
          gcloud run services update-traffic ogoogle-ai --project=ichiropractic --region=asia-south1 --to-latest --quiet
          gcloud run services update-traffic ogoogle-ai --project=ichiropractic --region=asia-south1 --remove-tags=candidate --quiet
      - name: Verify the released revision
        env:
          SMOKE_ORIGIN: https://ogoogle-ai-176787245026.asia-south1.run.app
          SMOKE_COACH_MODE: gemini
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
        run: node scripts/hosting-smoke.mjs
      - name: Roll back after a failed cutover
        if: failure() && steps.cutover.outcome != 'skipped'
        run: |
          gcloud run services update-traffic ogoogle-ai --project=ichiropractic --region=asia-south1             --to-revisions="$PREVIOUS_REVISION=100" --quiet
          echo "::error::Rolled traffic back to $PREVIOUS_REVISION; pin is left on purpose, see README (Deploy > Roll back)."
      - name: Remove generated credential configuration
        if: always()
        run: rm -f .deployment/runtime.json .deployment/update-env-vars.txt .deployment/service.json
