name: oGoogle AI checks
on:
  # Main only: fix branches are merged locally, so a branch push would just duplicate the run.
  push:
    branches: [main]
    # Briefs, trackers and notes change nothing that ships: no checks, no release.
    paths-ignore: ['docs/**', '*.md']
  pull_request:
  workflow_call:
    inputs:
      revision:
        type: string
        required: false
permissions:
  contents: read
# A newer push supersedes an older run on the same ref.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          install_components: cloud-firestore-emulator
      - name: Start local Firestore emulator
        run: |
          gcloud emulators firestore start --host-port=127.0.0.1:8085 --project=demo-ogoogle-local --quiet > "$RUNNER_TEMP/firestore.log" 2>&1 &
          uv run python -c 'import socket,time; deadline=time.monotonic()+30; ready=False
          while time.monotonic()<deadline:
              try:
                  socket.create_connection(("127.0.0.1",8085),timeout=1).close();ready=True;break
              except OSError: time.sleep(.2)
          assert ready, "Firestore emulator did not start"'
      - run: uv run ruff check app tests scripts server.py run.py face_worker.py
      - run: uv run ruff format --check app tests scripts server.py run.py face_worker.py
      - run: uv run mypy
      - run: uv run pytest -q
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
      - run: uv run pip-audit --local --progress-spinner off
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --project backend --locked
      - run: npm ci
      - run: uv run python -m scripts.export_contract
        working-directory: backend
      - run: npx openapi-typescript docs/openapi.json -o src/api/generated.d.ts
      - run: git diff --exit-code -- docs/openapi.json src/api/generated.d.ts
      - run: npm run lint
      - run: npm run build
      - run: npm run test:hooks
      - run: npm run format:check
  # Browser tests run per device project, each split into parallel shards.
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [phone, desktop]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --project backend --locked
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-failures-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results
          retention-days: 3
  # Runs alongside the tests; it only checks that the packaged app starts and serves.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: ogoogle-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the packaged application
        run: |
          docker run -d --name ogoogle-ci -p 8080:8080 -e APP_ENV=local -e AUTH_MODE=local -e SESSION_BACKEND=sqlite ogoogle-ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null; then break; fi
            sleep 1
          done
          SMOKE_AUTH_MODE=local node scripts/hosting-smoke.mjs
      - name: Show container errors
        if: failure()
        run: docker logs ogoogle-ci
      - name: Stop test container
        if: always()
        run: docker rm -f ogoogle-ci || true
