name: oGoogle AI checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check app tests scripts run.py
      - run: uv run ruff format --check app tests scripts run.py
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run pip-audit --local --progress-spinner off
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --project backend --locked
      - run: npm ci
      - run: uv run python -m scripts.export_contract
        working-directory: backend
      - run: npx openapi-typescript docs/openapi.json -o src/api/generated.d.ts
      - run: git diff --exit-code -- docs/openapi.json src/api/generated.d.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run format:check
